name: Батя Макса Worker (Cloudflare)
on:
  push:
    paths: ['batya-maksa/worker/**', '.github/workflows/batya-maksa-worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.APP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: batya-maksa/worker
        run: npm test
      - name: Deploy to Cloudflare
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: batya-maksa/worker
          wranglerVersion: "4"
          secrets: APP_TOKEN
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
      - name: Secrets missing
        if: env.HAS_CF != 'true'
        run: echo "::warning::Добавь секреты CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, APP_TOKEN (Settings → Secrets and variables → Actions)"
