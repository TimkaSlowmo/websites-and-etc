name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site folders
        run: |
          mkdir _site
          for d in zhanar-cosma alatau-wear; do cp -r "$d" "_site/$d"; done
          cp -r batya-maksa/download _site/proyom
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>websites-and-etc</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <body style="font-family:system-ui;max-width:480px;margin:10vh auto;padding:0 20px">
          <h1>Sites</h1><ul>
          <li><a href="zhanar-cosma/">Zhanar Cosma</a></li>
          <li><a href="alatau-wear/">ALATAU Wear</a></li>
          <li><a href="proyom/">Проём (iPhone)</a></li>
          </ul></body>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
