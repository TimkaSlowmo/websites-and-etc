name: Проём iOS (.ipa)
on:
  push:
    paths: ['batya-maksa/ios/**', '.github/workflows/batya-maksa-ios.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: proyom-ios
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: batya-maksa/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - name: Unit tests
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z ]+ \(' | sed 's/ ($//')
          echo "Simulator: $SIM"
          xcodebuild test -project OknoCalc.xcodeproj -scheme OknoCalc -destination "platform=iOS Simulator,name=$SIM" CODE_SIGNING_ALLOWED=NO | tail -40
      - name: Simulator screenshots
        continue-on-error: true
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z ]+ \(' | sed 's/ ($//')
          xcodebuild -project OknoCalc.xcodeproj -scheme OknoCalc -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$SIM" -derivedDataPath sim CODE_SIGNING_ALLOWED=NO build | tail -5
          bash ci-screens.sh "$SIM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screens
          path: batya-maksa/ios/screens/
      - name: Build unsigned .ipa
        run: |
          xcodebuild -project OknoCalc.xcodeproj -scheme OknoCalc -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/OknoCalc.app Payload/
          zip -qr Proyom.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Proyom-ipa
          path: batya-maksa/ios/Proyom.ipa
      - name: Put .ipa into the repository (batya-maksa/Proyom.ipa)
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          cp batya-maksa/ios/Proyom.ipa /tmp/Proyom.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q --depth=1 origin main && git reset -q --hard origin/main
            cp /tmp/Proyom.ipa batya-maksa/Proyom.ipa
            git add batya-maksa/Proyom.ipa
            git diff --cached --quiet && exit 0
            git commit -qm "Проём: свежая сборка Proyom.ipa [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: Update release (extra download link)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view proyom -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create proyom -R "$GITHUB_REPOSITORY" --latest --title "Проём для iPhone" \
              --notes "Скачай Proyom.ipa ниже (Assets) и поставь через Sideloadly. Также лежит в репозитории: batya-maksa/Proyom.ipa"
          gh release upload proyom Proyom.ipa --clobber -R "$GITHUB_REPOSITORY"
