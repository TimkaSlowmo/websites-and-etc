name: Батя Макса iOS (.ipa)
on:
  push:
    paths: ['batya-maksa/**', '.github/workflows/batya-maksa-ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: batya-maksa/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - name: Unit tests
        continue-on-error: true
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z ]+ \(' | sed 's/ ($//')
          echo "Simulator: $SIM"
          xcodebuild test -project OknoCalc.xcodeproj -scheme OknoCalc -destination "platform=iOS Simulator,name=$SIM" CODE_SIGNING_ALLOWED=NO | tail -40
      - name: Build unsigned .ipa
        run: |
          xcodebuild -project OknoCalc.xcodeproj -scheme OknoCalc -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/OknoCalc.app Payload/
          zip -qr BatyaMaksa.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BatyaMaksa-ipa
          path: batya-maksa/ios/BatyaMaksa.ipa
      - name: Publish release (stable download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete batya-maksa-latest --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create batya-maksa-latest BatyaMaksa.ipa -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Батя Макса (последняя сборка)" \
            --notes "Неподписанный .ipa. Установка через Sideloadly. Собрано из коммита $GITHUB_SHA"
