name: OknoCalc
options:
  bundleIdPrefix: kz.okno
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OknoCalc:
    type: application
    platform: iOS
    sources:
      - path: OknoCalc
    info:
      path: OknoCalc/Info.plist
      properties:
        CFBundleDisplayName: Проём
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        DefaultWorkerURL: $(DEFAULT_WORKER_URL)
        NSCameraUsageDescription: Камера нужна, чтобы сфотографировать чертёж окна.
        NSPhotoLibraryUsageDescription: Доступ к фото нужен, чтобы выбрать снимок чертежа.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.okno.calc
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEFAULT_WORKER_URL: https:/$()/batya-maksa-ai.makxxim-007.workers.dev
        TARGETED_DEVICE_FAMILY: "1"
  OknoCalcTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OknoCalcTests
      - path: OknoCalc/Resources/catalog.json
        buildPhase: resources
    dependencies:
      - target: OknoCalc
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OknoCalc:
    build:
      targets:
        OknoCalc: all
    test:
      targets:
        - OknoCalcTests
